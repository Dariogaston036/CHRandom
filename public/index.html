<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Random</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
  h1 { text-align:center; font-size:1.4rem; }
  .videos { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  video { width:45%; min-width:280px; background:#000; border-radius:8px; }
  .panel { max-width:500px; margin:20px auto; text-align:center; }
  select, button { padding:10px 16px; margin:6px; border-radius:6px; border:none; font-size:1rem; }
  button { background:#e63946; color:#fff; cursor:pointer; }
  button:disabled { background:#555; }
  #estado { margin-top:10px; color:#aaa; }
</style>
</head>
<body>
  <h1>Chat Random (demo local)</h1>

  <div class="panel" id="setup">
    <label>Sos:
      <select id="genero">
        <option value="hombre">Hombre</option>
        <option value="mujer">Mujer</option>
        <option value="otro">Otro</option>
      </select>
    </label>
    <label>Buscás:
      <select id="buscaGenero">
        <option value="cualquiera">Cualquiera</option>
        <option value="hombre">Hombre</option>
        <option value="mujer">Mujer</option>
      </select>
    </label>
    <br/>
    <button id="btnBuscar">Buscar pareja</button>
  </div>

  <div class="videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div class="panel">
    <button id="btnSiguiente" disabled>Siguiente</button>
    <button id="btnReportar" disabled>Reportar</button>
    <div id="estado">Sin conectar</div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const estado = document.getElementById("estado");
const btnBuscar = document.getElementById("btnBuscar");
const btnSiguiente = document.getElementById("btnSiguiente");
const btnReportar = document.getElementById("btnReportar");

let localStream;
let pc;
let partnerId;

const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

async function initMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;
}

function crearPeerConnection() {
  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      socket.emit("signal", { to: partnerId, data: { candidate: event.candidate } });
    }
  };
}

async function iniciarOferta() {
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit("signal", { to: partnerId, data: { sdp: offer } });
}

socket.on("esperando", () => {
  estado.textContent = "Buscando pareja...";
});

socket.on("match-encontrado", async ({ initiator, partnerId: pid }) => {
  partnerId = pid;
  estado.textContent = "¡Emparejado! Conectando video...";
  btnSiguiente.disabled = false;
  btnReportar.disabled = false;
  crearPeerConnection();
  if (initiator) await iniciarOferta();
});

socket.on("signal", async ({ from, data }) => {
  if (!pc) crearPeerConnection();
  if (data.sdp) {
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    if (data.sdp.type === "offer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("signal", { to: from, data: { sdp: answer } });
    }
  } else if (data.candidate) {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch (e) {
      console.error("Error agregando ICE candidate", e);
    }
  }
});

socket.on("partner-desconectado", () => {
  estado.textContent = "El otro usuario se desconectó.";
  limpiarConexion();
});

function limpiarConexion() {
  if (pc) {
    pc.close();
    pc = null;
  }
  remoteVideo.srcObject = null;
  btnSiguiente.disabled = true;
  btnReportar.disabled = true;
}

btnBuscar.addEventListener("click", async () => {
  if (!localStream) await initMedia();
  const genero = document.getElementById("genero").value;
  const buscaGenero = document.getElementById("buscaGenero").value;
  socket.emit("buscar-pareja", { genero, buscaGenero });
  btnBuscar.disabled = true;
});

btnSiguiente.addEventListener("click", () => {
  limpiarConexion();
  socket.emit("siguiente");
  const genero = document.getElementById("genero").value;
  const buscaGenero = document.getElementById("buscaGenero").value;
  socket.emit("buscar-pareja", { genero, buscaGenero });
});

btnReportar.addEventListener("click", () => {
  const motivo = prompt("Motivo del reporte:");
  if (motivo) {
    socket.emit("reportar", { motivo });
    alert("Reporte enviado.");
  }
});
</script>
</body>
</html>
